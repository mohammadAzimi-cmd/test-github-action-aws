name: Vault OIDC Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Step 1: Get GitHub OIDC token
      - name: Get GitHub OIDC token
        id: idtoken
        run: |
          TOKEN=$(curl -sSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vault" \
            | jq -r '.value')
          echo "GH_JWT=$TOKEN" >> $GITHUB_ENV

      # Step 2: Login to Vault using JWT
      - name: Login to Vault
        id: vault-login
        run: |
          LOGIN=$(curl -s --request POST \
            --data "{\"role\": \"github-action\", \"jwt\": \"$GH_JWT\"}" \
            https://charging-jam-fashion-sharing.trycloudflare.com/v1/auth/jwt/login)
          VAULT_TOKEN=$(echo $LOGIN | jq -r '.auth.client_token')
          echo "VAULT_TOKEN=$VAULT_TOKEN" >> $GITHUB_ENV

      # Step 3: Read KV v2 secret
      - name: Read secret from Vault
        id: vault-read
        run: |
          SECRET=$(curl -s \
            -H "X-Vault-Token: $VAULT_TOKEN" \
            https://charging-jam-fashion-sharing.trycloudflare.com/v1/secret/data/test \
            | jq -r '.data.data.MY_SECRET')
          echo "MY_SECRET=$SECRET" >> $GITHUB_ENV

      # Step 4: Use the secret
      - name: Print secret
        run: echo "SECRET = $MY_SECRET"
        env:
          MY_SECRET: ${{ env.MY_SECRET }}
